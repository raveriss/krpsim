# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: "3.10"
  UV_PYTHON: "3.10"
  UV_VERSION: "0.11.32"

jobs:
  pre-commit:
    name: Pre-commit checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Sync project and dependencies
        run: uv sync --locked --python "${PYTHON_VERSION}"

      - name: Run pre-commit
        run: uv run --no-sync pre-commit run --all-files

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    needs: pre-commit
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Sync project and dependencies
        run: uv sync --locked --python "${PYTHON_VERSION}"
      - name: Run Ruff
        run: uv run --no-sync ruff check .
      - name: Run MyPy
        run: uv run --no-sync mypy src tests
      - name: Run Black check
        run: uv run --no-sync black --check .
      - name: Run isort check
        run: uv run --no-sync isort --check-only .

  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync project and dependencies
        run: uv sync --locked --python "${PYTHON_VERSION}"

      - name: Run tests with coverage (XML at repo root)
        run: |
          uv run --no-sync pytest --cov=src --cov-branch --cov-report=xml:coverage.xml \
                                --junitxml=junit.xml -o junit_family=legacy
          ls -lah
          head -n 20 coverage.xml || true
          test -f coverage.xml || (echo "coverage.xml missing" && exit 1)

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          disable_search: true
          flags: unittests
          name: ci-ubuntu-py${{ env.PYTHON_VERSION }}
          slug: raveriss/krpsim
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [static-analysis, tests]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Sync runtime dependencies
        run: uv sync --locked --no-dev --python "${PYTHON_VERSION}"
      - name: Build package
        run: uv build --no-sources
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Extract version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish dist/*

  version-badge:
    name: Update version badge
    runs-on: ubuntu-latest
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set VERSION env
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
      - name: Install badge-maker
        run: npm install --global badge-maker@^3
      - name: Generate badge
        run: |
          mkdir -p docs/badges
          badge --label "version" --message "${{ env.VERSION }}" --color "blue" > docs/badges/version.svg
      - name: Commit & push badge
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs/badges/version.svg
          git commit -m "ci: update version badge to ${{ env.VERSION }}" || echo "No changes"
          git push
